name: Bug
description: Algo no funciona como debería
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Issues = bugs y pedidos; para charla abierta usa [Discussions](https://github.com/HobbitElegante/MTG-Rebuilder/discussions).
  - type: textarea
    id: what-happened
    attributes:
      label: Qué pasó / qué esperabas
      description: Describe el problema y el comportamiento que esperabas.
      placeholder: Al importar un mazo desde Moxfield… / Esperaba que…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Lo más concreto posible.
      placeholder: |
        1. Abrí Decks → Importar listado
        2. Pegué la URL de…
        3. …
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - Linux
        - Otro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      description: Tag del Release (p. ej. v1.2.0) o “desde código” si corres con uv/Python.
      placeholder: v1.2.0
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Captura / mensaje de error
      description: Pega el texto del error o adjunta una captura (arrastrar imagen aquí).
    validations:
      required: false
